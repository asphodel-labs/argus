version: 2

builds:
  - main: ./cmd/argus
    binary: argus
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  draft: false

homebrew_casks:
  - name: argus
    description: Terminal UI for the GitHub pull requests that concern you.
    homepage: https://github.com/asphodel-labs/argus
    binaries: [argus]
    repository:
      owner: asphodel-labs
      name: homebrew-tap
      git:
        url: git@github.com:asphodel-labs/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_SSH_KEY }}"
    commit_msg_template: "argus {{ .Tag }}"
    hooks:
      post:
        # The binary is not signed. Remove the quarantine attribute so that
        # macOS starts it.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/argus"]
          end
